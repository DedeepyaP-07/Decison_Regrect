
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decision Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            margin: 0;
            padding: 40px 20px;
            color: #20243a;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            color: #f9a8d4;
        }

        p {
            color: #626779;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5d8e2;
            border-radius: 8px;
            font: inherit;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #f9a8d4;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #f9a8d4;
        }

        .success {
            color: #86efac;
            font-weight: bold;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>Decision Tracker</h1>

    <p>
        Make thoughtful choices. Record your decisions today
        and compare your expectations with the outcome later.
    </p>

    <p id="message" class="success" hidden>
        Decision saved successfully!
    </p>

    <form action="addDecision" method="post">
        <label for="title">Decision Title</label>
        <input
                type="text"
                id="title"
                name="title"
                placeholder="e.g. Choosing a laptop"
                maxlength="150"
                required
        >

        <label for="description">Description</label>
        <textarea
                id="description"
                name="description"
                placeholder="What are you trying to decide?"
        ></textarea>

        <button type="submit">Save Decision</button>
    </form>
</div>

<script>
    const params = new URLSearchParams(window.location.search);

    if (params.get("success") === "1") {
        document.getElementById("message").hidden = false;
    }
</script>
</body>
</html>
